[global]
poll_interval_seconds = 30
default_timeout_minutes = 30
event_jsonl_path = "~/.local/state/actionq-dispatcher/events-smoke.jsonl"
budget_daily_usd = 5.0
budget_window_hours = 24
worktree_root = "~/.local/state/actionq-dispatcher/worktrees-smoke"
pause_file = "~/.local/state/actionq-dispatcher/PAUSED"
actionctl_bin = "actionctl"
claude_bin = "claude"

[global.sprintctl_takeup]
enabled = true
remote_only = true
actor_prefix = "actionq"
release_on_sprintctl_error = false

[projects.sprintctl]
path = "/projects/dev/sprintctl"
base_ref = "HEAD"
env = { SPRINTCTL_DB = "/projects/dev/sprintctl/.sprintctl/sprintctl.db", KCTL_DB = "/projects/dev/sprintctl/.kctl/kctl.db" }

[actions.scope-iterate]
model = "fake"
runner = "fake"
prompt_template = "/projects/dev/actionq-dispatcher/prompts/scope-iterate.md"
working_dir = "{worktree_root}/{project}/{action.id}"
tool_acl = "/projects/dev/actionq-dispatcher/acls/scope-iterate.json"
timeout_minutes = 5
max_cost_usd = 0.0
test_command = "python3 -c pass"
fake_commit_path = "docs/actionq-dispatch-smoke.md"
pre_gates = ["budget", "project-exists", "sprint-item-exists", "sprint-item-ready", "branch-absent"]
post_gates = ["branch-exists", "branch-ahead-of-base", "diff-nonempty", "worktree-clean", "diff-scope-respected", "tests-pass"]
