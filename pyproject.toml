[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionq-dispatcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
dispatcher-once = "actionq_dispatcher.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["actionq_dispatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
