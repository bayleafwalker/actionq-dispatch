[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionq-dispatcher"
version = "0.2.0"
description = "Retirement tombstone for the historical dispatcher-once command"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "bayleafwalker" }]
keywords = ["actionq", "cli", "dispatcher", "retired"]
classifiers = [
	"Development Status :: 7 - Inactive",
	"Environment :: Console",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Software Development :: Build Tools",
	"Topic :: Software Development :: Version Control :: Git",
	"Topic :: System :: Distributed Computing",
]
dependencies = ["click>=8.1"]

[project.urls]
Homepage = "https://github.com/bayleafwalker/actionq-dispatch"
Repository = "https://github.com/bayleafwalker/actionq-dispatch"
Issues = "https://github.com/bayleafwalker/actionq-dispatch/issues"
Documentation = "https://github.com/bayleafwalker/actionq-dispatch/blob/main/docs/runbook.md"

[project.scripts]
dispatcher-once = "actionq_dispatcher.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["actionq_dispatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
